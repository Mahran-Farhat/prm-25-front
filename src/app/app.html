  <!--

  Got it 👍 You’re on Angular 20 (so it’s using standalone components by default, no NgModule).

When you create a new component with:

ng generate component my-feature


Angular will generate something like:

import { Component } from '@angular/core';

@Component({
  selector: 'app-my-feature',
  standalone: true,
  templateUrl: './my-feature.component.html',
  styleUrls: ['./my-feature.component.css']
})
export class MyFeatureComponent {}

✅ Using it inside your main component (app.component.ts)

Import the new component

import { Component } from '@angular/core';
import { MyFeatureComponent } from './my-feature/my-feature.component';

@Component({
  selector: 'app-root',
  standalone: true,
  imports: [MyFeatureComponent],  // 👈 register it here
  templateUrl: './app.component.html',
  styleUrls: ['./app.component.css']
})
export class AppComponent {
  title = 'my-angular-app';
}


Use it in the template (app.component.html)

<h1>{{ title }}</h1>
<app-my-feature></app-my-feature>

✅ If you create multiple components

Just keep importing them into the parent component:

@Component({
  selector: 'app-root',
  standalone: true,
  imports: [MyFeatureComponent, AnotherComponent, YetAnotherComponent],
  templateUrl: './app.component.html',
})

✅ If you want them available across many components

Instead of importing them everywhere, create a Shared imports file:

src/app/shared/imports.ts

import { MyFeatureComponent } from '../my-feature/my-feature.component';
import { AnotherComponent } from '../another/another.component';

export const SHARED_IMPORTS = [
  MyFeatureComponent,
  AnotherComponent
];


Then in your component:

@Component({
  standalone: true,
  imports: [SHARED_IMPORTS],
  ...
})

-->
